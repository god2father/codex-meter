name: 构建 Windows 和 macOS 安装包

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: codex-meter-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: 缓存 Rust 构建结果
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 检查代码
        run: |
          npm run typecheck
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: 构建 Windows 安装包
        run: npm run tauri -- build --bundles nsis

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/codex-meter.exe
            src-tauri/target/release/bundle/nsis/*.exe

  macos:
    name: macOS ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple-Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: 缓存 Rust 构建结果
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm ci

      - name: 检查代码
        run: |
          npm run typecheck
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: 构建 macOS 应用和 DMG
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles app,dmg

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-macOS-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app/**
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

