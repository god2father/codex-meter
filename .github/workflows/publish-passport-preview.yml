name: Publish Passport Bridge preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-passport-preview.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event.head_commit.message == 'publish release v0.3.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Codex-Meter-Windows-x64
          path: artifacts/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37004993725
      - uses: actions/download-artifact@v4
        with:
          name: Codex-Meter-macOS-Apple-Silicon
          path: artifacts/arm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37004993725
      - uses: actions/download-artifact@v4
        with:
          name: Codex-Meter-macOS-Intel
          path: artifacts/intel
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37004993725
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$REPO/actions/runs/37004993725" --jq '.head_sha')"
          conclusion="$(gh api "repos/$REPO/actions/runs/37004993725" --jq '.conclusion')"
          test "$sha" = "0885d145d7eff98865f7847783bc84fc430feadb"
          test "$conclusion" = "success"
          mkdir -p assets
          cp "$(find artifacts/windows -type f -name codex-meter.exe -print -quit)" assets/Codex-Meter_0.3.2_Windows-x64-portable.exe
          cp "$(find artifacts/windows -type f -name '*setup.exe' -print -quit)" assets/Codex-Meter_0.3.2_Windows-x64-setup.exe
          cp "$(find artifacts/arm -type f -name '*.dmg' -print -quit)" assets/Codex-Meter_0.3.2_macOS-Apple-Silicon.dmg
          cp "$(find artifacts/intel -type f -name '*.dmg' -print -quit)" assets/Codex-Meter_0.3.2_macOS-Intel.dmg
          test "$(find assets -type f | wc -l)" -eq 4
          (cd assets && sha256sum * > SHA256SUMS.txt)
          gh release upload v0.3.2 assets/* --clobber --repo "$REPO"
          gh release edit v0.3.2 --repo "$REPO" --draft=false --prerelease --latest=false --target "$GITHUB_SHA"
